name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # First, because it is instant and because its failure mode is otherwise
      # baffling: a fixture that is on the author's machine but not in the repo
      # compiles locally and dies on a clean checkout with six include_bytes!
      # errors that say nothing about git. .gitignore carries extension-wide
      # rules (*.img, *.vhd) and `git add -A` skips ignored files in silence, so
      # this is a class of mistake, not a one-off.
      - name: Every fixture and vendored asset is committed
        shell: bash
        run: |
          # Every file on disk under fixtures/ that git is not tracking, whether
          # it is ignored or merely untracked. Staged files are already in the
          # index, so this does not fire on work in progress.
          stray=$(
            for d in crates/core/fixtures/ crates/core/assets/; do
              git ls-files --others --exclude-standard -- "$d"
              git ls-files --others --ignored --exclude-standard -- "$d"
            done
          )
          if [ -n "$stray" ]; then
            echo "::error::files under crates/core/fixtures/ are untracked or ignored:"
            echo "$stray"
            echo "A fixture that exists on one machine makes the suite look"
            echo "stronger than it is. Commit them, or add a .gitignore negation."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  # The Tauri app is excluded from the Cargo workspace (it has its own
  # lockfile), so every command in the job above is blind to it: `cargo clippy
  # --workspace` and `cargo build --workspace --release` both exit 0 with a hard
  # type error sitting in app/src-tauri/src/lib.rs. Verified by putting one
  # there.
  #
  # The second consequence is quieter and worse. security.yml audits
  # app/src-tauri/Cargo.lock, which made the app look covered — but `cargo
  # audit --file` reports only on crates the lockfile lists, and nothing had
  # refreshed that lockfile since the core gained its decoders. zip, liblzma,
  # ruzstd and bzip2 were all absent from it while the GUI linked every one of
  # them through sirius-flash-core. Building the crate in CI is what keeps the
  # lockfile current, and so what makes that audit mean what it claims.
  #
  # Linux only: the GUI is Linux-first and the macOS and Windows backends are
  # not written yet.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cheap and dependency-free, so it runs first and fails unambiguously.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Type-check and build the frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build          # tsc && vite build

      # webkit2gtk is what `tauri` links against; without these the crate does
      # not configure, let alone compile.
      - name: GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Lint the Tauri crate
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  # The boot-test harness, run against itself. The next phase writes an MBR and
  # a FAT32 boot record, and the only thing that can say whether 500 bytes of
  # assembly works is a machine trying to boot them — so the harness has to be
  # trustworthy before any of that is written.
  #
  # Its selftest is a negative test as much as a positive one: it asserts that
  # media with no boot code is reported as dead, and only then that a known-good
  # sector is reported as alive. A rig that has only ever seen a pass cannot be
  # told apart from one that always passes.
  #
  # Everything runs unprivileged under TCG, so no KVM and no root: this works in
  # a container as well as it does on a laptop.
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 nasm dosfstools
      - name: Boot-test harness selftest
        run: ./scripts/boottest.py selftest
