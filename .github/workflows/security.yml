name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # Advisories land continuously; a weekly run catches ones that appear
    # after a dependency was last touched.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check dependencies against the RustSec advisory database
        run: cargo audit
