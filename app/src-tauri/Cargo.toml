[package]
name = "sirius-flash-gui"
version = "0.1.0"
description = "Sirius Flash — cross-platform bootable USB creator"
authors = ["Clicksora, L.L.C."]
edition = "2021"

[lib]
name = "sirius_flash_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sirius-flash-core = { path = "../../crates/core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
